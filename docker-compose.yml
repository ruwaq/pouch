services:
  postgres:
    image: postgres:17-alpine
    container_name: pouch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pouch
      POSTGRES_PASSWORD: pouch
      POSTGRES_DB: pouch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
